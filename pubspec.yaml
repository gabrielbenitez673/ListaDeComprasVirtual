name: shopping_list_app
description: "Mi Changuito: Una aplicación de lista de compras virtual para organizar tus compras de manera eficiente."
publish_to: 'none'
version: 0.1.1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

fonts:
  - family: Montserrat
    fonts:
      - asset: assets/fonts/Montserrat-Regular.ttf
      - asset: assets/fonts/Montserrat-Bold.ttf
        weight: 700

flutter:
  uses-material-design: true
